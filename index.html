<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sva</title>
<meta name="theme-color" content="#0d0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="main.css">
</head>
<body>

  <header id="top">
    <a class="brand" href="#board"><span class="brand-dot"></span>Sva</a>
    <div id="mode" role="group" aria-label="Mode">
      <button type="button" data-mode="sankalpa" aria-pressed="true">Sankalpa</button>
      <button type="button" data-mode="goals" aria-pressed="false">Goals</button>
    </div>
    <nav id="nav" aria-label="Main">
      <a href="#sankalpa" data-route="sankalpa">Sankalpas</a>
      <a href="#board" data-route="board">Board</a>
      <a href="#progress" data-route="progress">Progress</a>
      <a href="#shareerik" data-route="shareerik">Shareerik</a>
      <a href="#adhyaatmik" data-route="adhyaatmik">Adhyaatmik</a>
      <a href="#maansik" data-route="maansik">Maansik</a>
    </nav>
    <span id="sync-state" aria-live="polite"></span>
    <a class="about-link" href="#about" data-route="about">About</a>
    <button id="signout" type="button" class="small ghost" hidden>Sign out</button>
  </header>

  <!-- shown instead of the app until you sign in (only when cloud-config.js is filled in) -->
  <div id="login" hidden>
    <form id="login-form">
      <p class="brand"><span class="brand-dot"></span>Sva</p>
      <h1>Sign in</h1>
      <label class="field"><span>Email</span>
        <input id="l-email" type="email" required autocomplete="username">
      </label>
      <label class="field"><span>Password</span>
        <input id="l-pass" type="password" required autocomplete="current-password">
      </label>
      <p id="login-error" class="error" hidden></p>
      <button id="login-submit" type="submit" class="primary">Sign in</button>
    </form>
  </div>

  <!-- Sankalpa mode: the yarn stays on screen the whole time (drawn by yarn.js) -->
  <section id="yarn" aria-label="Your progress, as a picture" hidden>
    <div id="yarn-canvas"></div>
    <div class="yarn-foot">
      <div id="visual" role="group" aria-label="Picture">
        <button type="button" data-visual="lotus" aria-pressed="true">Lotus</button>
        <button type="button" data-visual="yarn" aria-pressed="false">Yarn</button>
      </div>
      <p id="yarn-count" aria-live="polite"></p>
      <button id="yarn-settings" type="button" class="small ghost">Settings</button>
    </div>
  </section>

  <main id="view"></main>

  <!-- ======================================================================
       The About page. Edit the text here freely — it is plain HTML.
       ====================================================================== -->
  <template id="about-content">
    <article class="about">
      <p class="eyebrow">About</p>
      <h1>Sva</h1>
      <p class="lead">A quiet place to look after three parts of yourself: the body, the spirit and the mind.</p>

      <h2>What it is about</h2>
      <p>Big changes rarely come from big efforts. They come from small things done on ordinary days. Sva helps you decide what matters to you in each area of your life, break it down until it fits into a day, and then simply shows you what today asks of you.</p>

      <h2>How to use it</h2>
      <ol>
        <li><strong>Pick an area</strong> at the top: Shareerik, Adhyaatmik or Maansik.</li>
        <li><strong>Set a long-term goal.</strong> Where do you want to be in a year or more?</li>
        <li><strong>Add short-term goals inside it.</strong> The nearer milestones on the way there.</li>
        <li><strong>Add tasks to each short-term goal.</strong> The actual things you do. Describe them, put them on the calendar (once or repeating), and switch on a reminder or a timer if the task needs one. A task can be of a different nature than its goal: breathing practice for a running goal is Adhyaatmik work for a Shareerik goal. Set its Nature and it shows up in that column.</li>
        <li><strong>Open the Board each day.</strong> It shows what is planned in all three areas. Click a task to see its details, open its timer and practise, then tick it off.</li>
        <li><strong>Look at Progress now and then.</strong> It draws how much of what you planned you actually did, all three areas together. A missed day pulls the line down; a steady week lifts it again.</li>
      </ol>
      <p>The breathing dot lives on the Adhyaatmik page. Open it any time you want a few calm minutes, or attach it to a task's timer.</p>

      <h2>Sankalpa mode</h2>
      <p>The switch at the top turns Sva into something simpler. A sankalpa is one thing you resolve to do every day, for a number of days you choose: brush your teeth at night for the next 14 days. No long-term or short-term goals here, only the vow and its days.</p>
      <p>Tick it each day. Miss a day and that sankalpa is broken at once; you can take it again from day one. If you did do it and only could not open Sva to tick it, tap that day's little circle on the sankalpa: Sva asks whether you did it, and on yes the day is ticked and it carries on as if nothing happened. Tapping a filled circle asks the opposite and unticks it. Keep it to its last day and the lotus opens one more petal, in a soft shade of that sankalpa's area colour. It starts with none and is in full bloom at a thousand; then you can start again if you like.</p>
      <p>Under the picture you can switch from the lotus to the yarn: a tangled lump of thread that loses one tangle for every sankalpa you keep. Both show the same progress. Settings, beside the switch, lets you give the whole lotus one colour of your choosing, and changes how many petals it takes.</p>

      <h2>Good to know</h2>
      <p>Your goals are kept in your own account, behind your email and password, so they are the same on your phone, your computer and anywhere else you sign in. Nobody else can open them. Reminders appear while Sva is open.</p>
      <p>A copy also stays on the device, so Sva still works without signal and catches up once you are back online. A backup file is there if you want a copy of your own.</p>
      <p class="about-btns">
        <button type="button" data-act="export">Save a backup file</button>
        <button type="button" data-act="import">Load a backup file</button>
      </p>

      <section data-account hidden>
        <h2>Your account</h2>
        <p>Signed in as <strong data-email></strong>. Signing out also removes your goals from this device; they stay safe in your account.</p>
        <p class="about-btns">
          <button type="button" data-act="signout">Sign out</button>
        </p>
      </section>

      <h2>A wish for you</h2>
      <p>May you be patient with yourself on the slow days and proud of yourself on the good ones. May your body grow stronger, your mind clearer and your heart lighter, one small step at a time.</p>
      <p>Be well.</p>
    </article>
  </template>

  <!-- long-term / short-term goal editor -->
  <dialog id="goal-dialog">
    <form id="goal-form">
      <h2 id="goal-heading">Goal</h2>
      <label class="field"><span>Title</span>
        <input id="g-title" type="text" required maxlength="120" autocomplete="off">
      </label>
      <label class="field"><span>Description</span>
        <textarea id="g-desc" rows="3"></textarea>
      </label>
      <label class="field"><span>Target date <em>(optional)</em></span>
        <input id="g-target" type="date">
      </label>
      <label class="field" id="g-cat-field"><span>Area</span>
        <select id="g-cat"></select>
      </label>
      <label class="field" id="g-parent-field"><span>Inside long-term goal</span>
        <select id="g-parent"></select>
      </label>
      <div class="dialog-btns">
        <button type="button" id="g-delete" class="danger">Delete</button>
        <span class="grow"></span>
        <button type="button" id="g-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- sankalpa editor -->
  <dialog id="sk-dialog">
    <form id="sk-form">
      <h2 id="sk-heading">Sankalpa</h2>
      <label class="field"><span>What do you resolve to do, each day?</span>
        <input id="k-title" type="text" required maxlength="120" autocomplete="off" placeholder="Brush my teeth at night">
      </label>
      <label class="field"><span>Description <em>(optional)</em></span>
        <textarea id="k-desc" rows="2"></textarea>
      </label>
      <label class="field"><span>Area</span>
        <select id="k-cat"></select>
      </label>
      <div class="grid2">
        <label class="field"><span>For how many days</span><input id="k-days" type="number" min="1" max="3650" required></label>
        <label class="field"><span>Starts on</span><input id="k-start" type="date" required></label>
      </div>
      <p id="k-locked" class="hint" hidden>It has begun, so its start day and length stay as they are.</p>
      <label class="field"><span>At <em>(optional)</em></span><input id="k-time" type="time"></label>

      <fieldset>
        <legend><label class="check"><input id="k-rem" type="checkbox"><span>Remind me</span></label></legend>
        <p id="k-rem-hint" class="hint">Needs a time above.</p>
        <label class="field" id="k-rem-fields"><span>How early</span>
          <select id="k-before">
            <option value="0">At the start time</option>
            <option value="5">5 minutes before</option>
            <option value="10">10 minutes before</option>
            <option value="15">15 minutes before</option>
            <option value="30">30 minutes before</option>
            <option value="60">1 hour before</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend><label class="check"><input id="k-timer" type="checkbox"><span>It uses a timer</span></label></legend>
        <div id="k-timer-fields">
          <label class="field"><span>Minutes</span><input id="k-minutes" type="number" min="1" max="600" value="15"></label>
          <label class="check"><input id="k-dot" type="checkbox"><span>Show the breathing dot while the timer runs</span></label>
        </div>
      </fieldset>

      <p id="k-error" class="error" hidden></p>
      <div class="dialog-btns">
        <button type="button" id="k-delete" class="danger">Delete</button>
        <span class="grow"></span>
        <button type="button" id="k-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- a yes / no question (used when you tap a day's circle on a sankalpa) -->
  <dialog id="ask-dialog">
    <div class="ask">
      <h2 id="ask-text"></h2>
      <p id="ask-note" class="hint" hidden></p>
      <div class="dialog-btns">
        <span class="grow"></span>
        <button type="button" id="ask-no" class="ghost">No</button>
        <button type="button" id="ask-yes" class="primary">Yes</button>
      </div>
    </div>
  </dialog>

  <!-- yarn settings -->
  <dialog id="yarn-dialog">
    <form id="yarn-form">
      <h2>The picture</h2>
      <p id="y-now" class="muted"></p>
      <label class="field"><span>How many petals the lotus has, and tangles the yarn <em>(one for every sankalpa you keep)</em></span>
        <input id="y-total" type="number" min="1" max="2000" required>
      </label>
      <label class="field"><span>Petals of the lotus</span>
        <select id="y-petals">
          <option value="area">Each petal in its area's colour, as a soft pastel</option>
          <option value="one">The whole lotus in one colour</option>
        </select>
      </label>
      <div class="field" id="y-lotus-field"><span>Colour of the lotus</span>
        <span class="inline">
          <input id="y-lotus" type="color" aria-label="Colour of the lotus">
          <button type="button" id="y-lotus-reset" class="small ghost">Use the usual colour</button>
        </span>
      </div>
      <div class="dialog-btns">
        <button type="button" id="y-again" class="danger">Start again from the beginning</button>
        <span class="grow"></span>
        <button type="button" id="y-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- task editor -->
  <dialog id="task-dialog">
    <form id="task-form">
      <h2 id="task-heading">Task</h2>
      <p id="task-path" class="muted"></p>

      <label class="field"><span>Title</span>
        <input id="t-title" type="text" required maxlength="120" autocomplete="off">
      </label>
      <label class="field"><span>Description</span>
        <textarea id="t-desc" rows="3" placeholder="What exactly do you do, and how?"></textarea>
      </label>
      <label class="field"><span>Nature <em>(what kind of activity it is; decides its column on the Board)</em></span>
        <select id="t-nature"></select>
      </label>

      <fieldset>
        <legend><label class="check"><input id="t-sched" type="checkbox"><span>Put it on the calendar</span></label></legend>
        <div id="sched-fields">
          <div class="grid2">
            <label class="field"><span>Starts on</span><input id="t-start" type="date"></label>
            <label class="field"><span>At <em>(optional)</em></span><input id="t-time" type="time"></label>
          </div>
          <div class="grid2">
            <label class="field"><span>Repeats</span>
              <select id="t-repeat">
                <option value="none">Does not repeat</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </label>
            <label class="field" id="interval-field"><span>Every</span>
              <span class="inline"><input id="t-interval" type="number" min="1" max="99" value="1"><span id="t-unit">day(s)</span></span>
            </label>
          </div>
          <div class="field" id="weekdays-field">
            <span>On</span>
            <div id="t-weekdays" class="weekdays">
              <label><input type="checkbox" value="1"><span>Mon</span></label>
              <label><input type="checkbox" value="2"><span>Tue</span></label>
              <label><input type="checkbox" value="3"><span>Wed</span></label>
              <label><input type="checkbox" value="4"><span>Thu</span></label>
              <label><input type="checkbox" value="5"><span>Fri</span></label>
              <label><input type="checkbox" value="6"><span>Sat</span></label>
              <label><input type="checkbox" value="0"><span>Sun</span></label>
            </div>
          </div>
          <div class="grid2" id="end-fields">
            <label class="field"><span>Ends</span>
              <select id="t-end">
                <option value="never">Never</option>
                <option value="until">On a date</option>
                <option value="count">After a number of times</option>
              </select>
            </label>
            <label class="field" id="until-field"><span>Last day</span><input id="t-until" type="date"></label>
            <label class="field" id="count-field"><span>Times</span><input id="t-count" type="number" min="1" max="999" value="10"></label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend><label class="check"><input id="t-rem" type="checkbox"><span>Remind me</span></label></legend>
        <p id="rem-hint" class="hint">Needs a calendar date and a time above.</p>
        <label class="field" id="rem-fields"><span>How early</span>
          <select id="t-before">
            <option value="0">At the start time</option>
            <option value="5">5 minutes before</option>
            <option value="10">10 minutes before</option>
            <option value="15">15 minutes before</option>
            <option value="30">30 minutes before</option>
            <option value="60">1 hour before</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend><label class="check"><input id="t-timer" type="checkbox"><span>This task uses a timer</span></label></legend>
        <div id="timer-fields">
          <label class="field"><span>Minutes</span><input id="t-minutes" type="number" min="1" max="600" value="15"></label>
          <label class="check"><input id="t-dot" type="checkbox"><span>Show the breathing dot while the timer runs</span></label>
        </div>
      </fieldset>

      <p id="task-error" class="error" hidden></p>
      <div class="dialog-btns">
        <button type="button" id="t-delete" class="danger">Delete</button>
        <span class="grow"></span>
        <button type="button" id="t-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- timer / practice screen -->
  <div id="timer" hidden>
    <iframe id="timer-dot" title="Breathing dot" hidden></iframe>
    <div class="timer-top">
      <div>
        <span id="timer-cat" class="chip"></span>
        <h2 id="timer-title"></h2>
        <p id="timer-sub"></p>
      </div>
      <button id="timer-close" type="button" aria-label="Close timer">&times;</button>
    </div>
    <div class="timer-bottom">
      <div id="timer-clock">00:00</div>
      <div class="timer-controls">
        <label>Minutes <input id="timer-min" type="number" min="1" max="600"></label>
        <button id="timer-toggle" type="button" class="primary">Start</button>
        <button id="timer-reset" type="button" class="ghost">Reset</button>
        <button id="timer-done" type="button" class="primary" hidden>Mark done</button>
      </div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>

<script src="schedule.js"></script>
<script src="anime.min.js"></script>
<script src="yarn.js"></script>
<script src="lotus.js"></script>
<script src="cloud-config.js"></script>
<script src="sync.js"></script>
<script src="main.js"></script>
</body>
</html>
